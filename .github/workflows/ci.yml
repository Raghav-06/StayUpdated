name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stayupdated_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      # The tests use a local mock AI server and fixture news pages: no API keys or secrets needed.
      - name: Backend tests
        run: npm test --prefix backend
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/stayupdated_test

      - name: Frontend lint
        run: npm run lint --prefix frontend

      - name: Frontend tests
        run: npm test --prefix frontend

      - name: Frontend build
        run: npm run build --prefix frontend
